[package]
name = "sing-box-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal dashboard for the sing-box VPN: live status, ping, config, and log"
license = "MIT"

[lib]
name = "sing_box_tui"
path = "src/lib.rs"

[[bin]]
name = "sing-box-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
libc = "0.2"
dirs = "5"

[dev-dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
# Personal tool: keep pedantic lints as notes, not errors.
pedantic = { level = "allow" }
